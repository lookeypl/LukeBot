<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans" rel="stylesheet">
<script type="application/javascript" src="/js/lukebot-widget-common.js"></script>

<style>
    html {
        font-family: 'Open Sans',Arial,sans-serif;
        font: 16px 'Open Sans';
    }

    body {
        background-color: rgba(0, 0, 0, 0);
        overflow: hidden;
        color: #ffffff;
    }

    #chat {
        overflow: hidden;
        position: absolute;
        bottom: 0;
        left: 0px;
        width: 100vw;
        padding-left: 2px;
        padding-right: 2px;
        white-space: normal;
        word-wrap: break-word;
        text-shadow: black 0px 0px 2px, black 0px 0px 2px, black 0px 0px 2px;
    }

    .chat-inline {
        display: inline;
    }

    .chat-line {
        line-height: 2rem;
    }

    .chat-text-fragment {
        vertical-align: baseline;
    }

    .chat-action-text-fragment {
        font-style: italic;
    }

    .chat-system-text-fragment {
        font-style: italic;
        color: grey;
        text-shadow: none;
    }

    .chat-emote {
        position: relative;
        margin: -.5rem 0;
        vertical-align: middle;
    }
    .chat-badges-span {
        margin-right: 0.1em;
        vertical-align: middle;
    }
    .chat-badge {
        margin-right: 0.1em;
        height: 1em;
    }

    .notice-line {
        line-height: 2rem;
        background-color: rgba(170, 170, 170, 0.3);
        border-left: 5px solid rgba(170, 170, 170, 0.8);
    }

    .notice-headline {
        padding-left: 6px;
    }

    .notice-headline-user {
        font-weight: 900;
    }

    .notice-headline-message {
        color: rgba(230, 230, 230, 0.9);
    }

    .notice-message {
        padding-left: 12px;
    }
</style>

<div id="chat">
</div>

<script>
    const TWITCH_EMOTE_URL_SCHEME = ["//static-cdn.jtvnw.net/emoticons/v2/", "/default/dark/1.0", "/default/dark/2.0", "/default/dark/3.0"];
    const TWITCH_BADGE_URL_SCHEME = ["//static-cdn.jtvnw.net/badges/v1/", "/1", "/2", "/3"];
    const FFZ_EMOTE_URL_SCHEME = ["//cdn.frankerfacez.com/emoticon/", "/1", "/2", "/4"];
    const FFZ_ANIMATED_EMOTE_URL_SCHEME = ["//cdn.frankerfacez.com/emoticon/", "/animated/1", "/animated/2", "/animated/4"];
    const BTTV_EMOTE_URL_SCHEME = ["//cdn.betterttv.net/emote/", "/1x", "/2x", "/3x"];
    const SEVENTV_EMOTE_URL_SCHEME = ["//cdn.7tv.app/emote/", "/1x.webp", "/2x.webp", "/4x.webp"];

    class Emote {
        constructor(source, id, width, height, from, to, animated) {
            this.Source = source;
            this.EmoteID = id;
            this.Width = width;
            this.Height = height;
            this.From = from;
            this.To = to;
            this.Animated = animated;
        }
    }

    class Badge {
        constructor(name, resource) {
            this.Name = name;
            this.Resource = resource;
        }
    }

    const ChatNodeType = Object.freeze({
        Unknown: 0,
        Message: 1,
        System: 2,
        Notice: 3,
    });

    const ChatMessageType = Object.freeze({
        Message: 0,
        Action: 1
    });

    const EventType = Object.freeze({
        ChatMessage: "TwitchChatMessage",
        ChatClearMessage: "TwitchChatClearMessage",
        ChatClearUser: "TwitchChatClearUser",
        WatchStreak: "TwitchWatchStreak",
        Cheer: "TwitchCheer",
        Subscription: "TwitchSubscription",
        ChannelPointsRedemption: "TwitchChannelPointsRedemption"
    })

    class ChatListEntry {
        Type = ChatNodeType.Unknown;
        EntryID = "";

        constructor(id) {
            this.EntryID = id;
        }

        form(msgObj) {
            throw new Error("form(msgObj) not implemented");
        }

        generateNode() {
            throw new Error("generateNode() not implemented");
        }

        static event(msgObj) {
            let ret = null;

            switch (msgObj.EventName) {
            case EventType.ChatMessage: {
                ret = new MessageEntry(msgObj.MessageID);
                break;
            }
            case EventType.WatchStreak:
            case EventType.Cheer:
            case EventType.Subscription:
            case EventType.ChannelPointsRedemption: {
                ret = new NoticeEntry(msgObj.NoticeID);
                break;
            }
            default:
                throw new TypeError(`Invalid/Unknown message object event name ${msgObj.EventName}`)
            }

            ret.form(msgObj);
            return ret;
        }

        static system(msgString) {
            return new SystemMessageEntry(msgString);
        }
    }

    class MessageEntry extends ChatListEntry {
        UserID = "";
        Color = "";
        User = "";
        DisplayName = "";
        Message = "";
        MessageType = ChatMessageType.Message;
        Emotes = [];
        Badges = [];

        constructor(id) {
            super(id)
            this.Type = ChatNodeType.Message;
        }

        form(msgObj) {
            if (msgObj.EventName != EventType.ChatMessage)
                throw new TypeError("Invalid message type");

            this.UserID = msgObj.UserID;
            this.Color = msgObj.Color;
            this.User = msgObj.User;
            this.DisplayName = msgObj.DisplayName;
            this.Message = msgObj.Message;
            this.MessageType = msgObj.MessageType;
            if (msgObj.Emotes != undefined) {
                msgObj.Emotes.forEach(function (e) {
                    e.Ranges.forEach(function (r) {
                        this.Emotes.push(new Emote(e.Source, e.ID, e.Width, e.Height, r.From, r.To, e.Animated));
                    }, this);
                }, this);

                // reverse-sort the emotes, mostly because it's easier to go through
                // the message in reverse afterwards (less indexing/shifting magic)
                this.Emotes.sort(function(a, b) {
                    if (a.From < b.From)
                        return 1;
                    else if (a.From > b.From)
                        return -1;
                    else
                        return 0;
                });
            }
            if (msgObj.Badges) {
                msgObj.Badges.forEach((b) => {
                    this.Badges.push(new Badge(b.Name, b.Resource));
                }, this);
            }
        }

        #loadImageWithScheme(emoteID, source, scheme) {
            let url = scheme[0] + emoteID;
            let img = document.createElement("img");
            img.src = url + scheme[1];
            img.srcset =
                url + scheme[1] + " 1x, " +
                url + scheme[2] + " 2x, " +
                url + scheme[3];
            if (source == "BTTV")
                img.srcset = img.srcset + " 3x";
            else
                img.srcset = img.srcset + " 4x";

            let imgLoadTries = 0;
            img.onerror = function() {
                // Sometimes it just happens that CDNs don't want to
                // provide us with the image. If that happens, try and
                // trigger redownloading the image by resetting its src
                // and srcset. Only do that 5 times max though.
                if (!imgLoadTries) {
                    imgLoadTries = 0;
                }
                imgLoadTries += 1;

                if (imgLoadTries > 5) {
                    this.style.display = 'none';
                } else {
                    // Retry the load by providing the same src/srcset.
                    // Also do this after 100ms to not spam Twitch's CDN
                    // with requests.
                    setTimeout(() => {
                        img.src = url + scheme[1];
                        img.srcset =
                            url + scheme[1] + " 1x, " +
                            url + scheme[2] + " 2x, " +
                            url + scheme[3] + " 4x";
                    }, 100);
                }
            }

            return img;
        }

        generateNode() {
            let user = this.DisplayName;
            if (user == "")
                user = this.User;

            let userTextNode = document.createTextNode(user);

            let badgeNode = document.createElement("span");
            badgeNode.classList.add("chat-badges-span");

            let userNode = document.createElement("span");
            userNode.style.color = this.Color;
            userNode.appendChild(userTextNode);

            let colonNode = document.createElement("span");
            colonNode.appendChild(document.createTextNode(": "));

            let textNode = document.createElement("span");
            textNode.classList.add("chat-text-fragment");
            if (this.MessageType == ChatMessageType.Action) {
                textNode.classList.add("chat-action-text-fragment");
            }
            let textDataNode = document.createTextNode(`${this.Message}`);
            textNode.appendChild(textDataNode);

            // replace emote texts based on ranges with links to emotes
            if (this.Emotes != undefined) {
                this.Emotes.forEach(function (e) {
                    let scheme = undefined;
                    if (e.Source == "Twitch") {
                        scheme = TWITCH_EMOTE_URL_SCHEME;
                    } else if (e.Source == "FFZ") {
                        if (e.Animated) {
                            scheme = FFZ_ANIMATED_EMOTE_URL_SCHEME;
                        } else {
                            scheme = FFZ_EMOTE_URL_SCHEME;
                        }
                    } else if (e.Source == "BTTV") {
                        scheme = BTTV_EMOTE_URL_SCHEME;
                    } else if (e.Source == "SevenTV") {
                        scheme = SEVENTV_EMOTE_URL_SCHEME;
                    } else {
                        printDebug("Invalid emote source - skipping");
                        return;
                    }

                    let img = this.#loadImageWithScheme(e.EmoteID, e.Source, scheme);
                    img.classList.add("chat-emote");

                    let imgDiv = document.createElement("div");
                    imgDiv.classList.add("chat-inline");
                    imgDiv.appendChild(img);

                    let textRemainder = textDataNode.splitText(e.From);
                    textRemainder.deleteData(0, e.To - e.From + 1);
                    textNode.insertBefore(imgDiv, textRemainder);
                }, this);
            }

            if (this.Badges) {
                this.Badges.forEach((b) => {
                    let img = this.#loadImageWithScheme(b.Resource, "TTVBadge", TWITCH_BADGE_URL_SCHEME);
                    img.classList.add("chat-badge");
                    badgeNode.appendChild(img);
                }, this);
            }

            let newMsgNode = document.createElement("div");
            newMsgNode.setAttribute("msgid", this.EntryID);
            newMsgNode.setAttribute("msguser", this.User);
            newMsgNode.classList.add("chat-line");
            newMsgNode.appendChild(badgeNode);
            newMsgNode.appendChild(userNode);
            newMsgNode.appendChild(colonNode);
            newMsgNode.appendChild(textNode);
            newMsgNode.appendChild(document.createElement("br"));
            return newMsgNode;
        }
    }

    class NoticeEntry extends ChatListEntry {
        UserID = "";
        User = "";
        DisplayName = "";
        Headline = "";
        Message = null;

        constructor(id) {
            super(id);
            this.Type = ChatNodeType.Notice;
        }

        #formCommon(msgObj) {
            if (msgObj.Message) {
                this.Message = new MessageEntry(msgObj.MessageID);
                this.Message.form(msgObj.Message);
            }

            this.User = msgObj.User;
            this.DisplayName = msgObj.DisplayName;
        }

        #formWatchStreak(msgObj) {
            this.#formCommon(msgObj);
            this.Headline = ` reached a ${msgObj.Streak}-stream streak!`;
        }

        #formCheer(msgObj) {
            this.#formCommon(msgObj);
            this.Headline = ` cheered ${msgObj.Amount} bits!`;
        }

        #formChannelPointsRedemption(msgObj) {
            this.#formCommon(msgObj);
            this.Headline = ` redeemed ${msgObj.Title} | ${msgObj.Cost}`;
        }

        #formSubscription(msgObj) {
            this.#formCommon(msgObj);

            let tier = msgObj.Details.Tier / 1000;
            switch (msgObj.Details.Type)
            {
            case TwitchSubscriptionType.New:
                this.Headline = ` subscribed at Tier ${tier}!`;
                break;
            case TwitchSubscriptionType.Gift:
                this.Headline = ` gifted ${msgObj.Details.RecipentCount} Tier ${tier} subscriptions!`;
                break;
            case TwitchSubscriptionType.Resub:
                if (msgObj.Details.Streak != 0) {
                    this.Headline = ` subscribed at Tier ${tier} for ${msgObj.Details.Cumulative} months, being on a ${msgObj.Details.Streak}-month sub streak!`;
                } else {
                    this.Headline = ` subscribed at Tier ${tier} for ${msgObj.Details.Cumulative} months!`;
                }
                break;
            default:
                throw new TypeError(`Unrecognized subscription type ${msgObj.Details.Type}`);
            }
        }

        form(msgObj) {
            switch (msgObj.EventName) {
            case EventType.WatchStreak: {
                this.#formWatchStreak(msgObj);
                break;
            }
            case EventType.Cheer: {
                this.#formCheer(msgObj);
                break;
            }
            case EventType.Subscription: {
                this.#formSubscription(msgObj);
                break;
            }
            case EventType.ChannelPointsRedemption: {
                this.#formChannelPointsRedemption(msgObj);
                break;
            }
            default:
                throw new TypeError(`Invalid message type ${msgObj.EventName}`);
            }
        }

        generateNode() {
            let username = this.DisplayName;
            if (!username) {
                username = this.User;
            }

            let noticeUserNode = document.createElement("span");
            noticeUserNode.appendChild(document.createTextNode(`${username}`));
            noticeUserNode.classList.add("notice-headline-user");

            let noticeHeadlineMsgNode = document.createElement("span");
            noticeHeadlineMsgNode.appendChild(document.createTextNode(`${this.Headline}`));
            noticeHeadlineMsgNode.classList.add("notice-headline-message");

            let noticeHeadlineNode = document.createElement("div");
            noticeHeadlineNode.appendChild(noticeUserNode);
            noticeHeadlineNode.appendChild(noticeHeadlineMsgNode);
            noticeHeadlineNode.classList.add("notice-headline");

            let newNode = document.createElement("div");
            newNode.classList.add("notice-line");
            newNode.appendChild(noticeHeadlineNode);
            if (this.Message) {
                let noticeMessageNode = this.Message.generateNode();
                noticeMessageNode.classList.add("notice-message");
                newNode.appendChild(noticeMessageNode);
            }
            return newNode;
        }
    }

    class SystemMessageEntry extends ChatListEntry {
        static #counter = 0;
        static #getID() {
            SystemMessageEntry.#counter += 1;
            return `system-${SystemMessageEntry.#counter}`;
        }

        Message = "";

        constructor(msg) {
            super(SystemMessageEntry.#getID());
            this.Type = ChatNodeType.System;
            this.Message = msg;
        }

        form(msgObj) {
            throw new Error("form(msgObj) not implemented");
        }

        generateNode() {
            let textNode = document.createElement("span");
            textNode.classList.add("chat-text-fragment");
            textNode.classList.add("chat-system-text-fragment");
            let textDataNode = document.createTextNode(`${this.Message}`);
            textNode.appendChild(textDataNode);

            let newMsgNode = document.createElement("span");
            newMsgNode.setAttribute("msgid", this.EntryID);
            newMsgNode.classList.add("chat-line");
            newMsgNode.appendChild(textNode);
            newMsgNode.appendChild(document.createElement("br"));
            return newMsgNode;
        }
    }

    class Chat {
        #chat = document.getElementById('chat');

        constructor() {
        }

        #appendToChatNode(msgNode) {
            this.#chat.appendChild(msgNode);
            if (this.#chat.childNodes.length > 30) {
                this.#chat.removeChild(this.#chat.firstChild);
            }
        }

        add(chatListNode) {
            this.#appendToChatNode(chatListNode.generateNode());
        }

        remove(msgObj) {
            let id = msgObj.MessageID;
            if (msgObj.MessageID == "") {
                // TODO - with no tags search for message itself by content and user and remove it
                printDebug("Cannot remove message - no msg id provided");
                return;
            }

            let msgNode = chat.querySelector(`[msgid="${id}"]`);
            printDebug(msgNode);
            msgNode.remove();
        }

        removeUser(msgObj) {
            let msgs = chat.querySelectorAll(`[msguser=${msgObj.Nick}]`);

            msgs.forEach(function(m) {
                m.remove();
            });
        }
    }

    let chatMgr = new Chat();

    let chatWidget = new LukeBotWidget();
    chatWidget.registerMessage(EventType.ChatMessage, (obj) => {
        chatMgr.add(ChatListEntry.event(obj));
    });
    chatWidget.registerMessage(EventType.WatchStreak, (obj) => {
        chatMgr.add(ChatListEntry.event(obj));
    });
    chatWidget.registerMessage(EventType.Cheer, (obj) => {
        chatMgr.add(ChatListEntry.event(obj));
    });
    chatWidget.registerMessage(EventType.Subscription, (obj) => {
        chatMgr.add(ChatListEntry.event(obj));
    });
    chatWidget.registerMessage(EventType.ChannelPointsRedemption, (obj) => {
        chatMgr.add(ChatListEntry.event(obj));
    });
    chatWidget.registerMessage(EventType.ChatClearUser, (obj) => {
        chatMgr.removeUser(obj);
    });
    chatWidget.registerMessage(EventType.ChatClearMessage, (obj) => {
        chatMgr.remove(obj);
    });
    chatWidget.registerMessageError((error) => {
        chatMgr.add(MessageEntry.system(`Error while processing new message: ${error}`));
        console.log(`Stack trace:\n${error.stack}`);
    });
    chatWidget.registerConnectionError((error) => {
        chatMgr.add(MessageEntry.system(`Connection error: ${error}`));
    });
    chatWidget.registerClose((e) => {
        if (e.wasClean) {
            chatMgr.add(MessageEntry.system(`Disconnected from LukeBot`));
        } else {
            chatMgr.add(MessageEntry.system(`Connection lost: ${e}`));
        }
    });
</script>
