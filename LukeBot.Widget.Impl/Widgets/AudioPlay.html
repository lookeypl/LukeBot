<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans" rel="stylesheet">
<script src="/js/lukebot-widget-common.js"></script>

<script>
    class AudioPlayConfig {
        constructor(receivedConfig) {
            if (receivedConfig.EventName != "AudioPlayWidgetInternalConfig") {
                throw new Error("Invalid config object received");
            }

            this.QueuePlayback = receivedConfig.QueuePlayback;
        }
    }

    let Settings = null;
    const executionQueue = new ExecutionQueue();

    class RandomAudioAlert extends AlertStep {
        constructor(audioPath, totalLength, minInterval, maxInterval) {
            super();
            if (audioPath) {
                this.setPath(audioPath);
                this.mTotalLength = totalLength;
                this.mMinInterval = minInterval;
                this.mMaxInterval = maxInterval;
                this.mIntervalLength = maxInterval - minInterval;
                this.mTotalTime = 0;
            }
        }

        setPath(path) {
            this.mAudioPath = path;
        }

        execute(next, status) {
            fetch(this.mAudioPath)
                .catch((error) => {
                    status.fail(`ERROR fetching audio file: ${error}`);
                    next();
                })
                .then((response) => {
                    if (response.ok) {
                        return response.blob();
                    } else {
                        throw new Error(`Bad response from fetching audio file: ${response.status}`);
                    }
                })
                .catch((error) => {
                    status.fail(`ERROR getting response blob: ${error}`);
                    next();
                })
                .then((blob) => {
                    try {
                        var audioURL = window.URL.createObjectURL(blob);
                        this.mAudio = new Audio(audioURL);
                        this.mAudio.addEventListener("ended", (event) => {
                            // note that this happens after we send back the response that we're done
                            // since this is supposed to stack and run in parallel
                            // as such, there can be NO status modifications here
                            console.log(`ended, time ${this.mTotalTime} length ${this.mTotalLength}`);
                            if (this.mTotalTime > this.mTotalLength)
                                return;

                            var time = Math.random() * this.mIntervalLength;
                            this.mTotalTime += this.mMinInterval + time;
                            setTimeout(() => {
                                console.log("replay");
                                this.mAudio.currentTime = 0;
                                this.mAudio.play();
                            }, (this.mMinInterval + time) * 1000);
                        });
                        this.mAudio.addEventListener("canplaythrough", (event) => {
                            this.mAudio.play()
                                .catch((reason) => {
                                    status.fail(`ERROR playing audio: ${reason}`);
                                    next();
                                })
                                .then(() => next());
                        });
                    } catch (e) {
                        status.fail(`ERROR caught while trying to play audio: ${e}`);
                        next();
                    }
                })
                .catch((error) => {
                    status.fail(`ERROR playing audio: ${error}`);
                    next();
                });
        }

        interrupt() {
            if (this.mAudio) {
                this.mAudio.pause();
            }
        }
    }

    let audioPlayWidget = new LukeBotWidget();
    audioPlayWidget.registerMessage("AlertInterrupt", (obj) => {
        executionQueue.interrupt(0);
        audioPlayWidget.send(WidgetResponse.fromMessage(obj));
    });
    audioPlayWidget.registerMessage("AudioPlayWidgetInternalConfig", (obj) => {
        Settings = new AudioPlayConfig(obj);
        audioPlayWidget.send(WidgetResponse.fromMessage(obj));
    });
    audioPlayWidget.registerMessage("AudioPlayStartFilePlayback", (obj) => {
        if (!obj.File) {
            audioPlayWidget.send(WidgetResponse.fromError(obj.EventID, `ERROR undefined file to play`));
        }

        let audioPlayChain = new AlertChain(obj);
        if (obj.RandomRepeat == true) {
            audioPlayChain.add(new RandomAudioAlert(obj.File, obj.TotalLength, obj.MinInterval, obj.MaxInterval));
        } else {
            audioPlayChain.add(new AudioAlert(obj.File));
        }

        audioPlayChain.add(new AlertChainComplete(obj, audioPlayWidget, executionQueue));
        if (Settings.QueuePlayback) {
            executionQueue.push(audioPlayChain);
        } else {
            audioPlayChain.execute();
        }
    });
    audioPlayWidget.registerMessage("AudioPlayStartTTSPlayback", (obj) => {
        let audioPlayChain = new AlertChain(obj);
        audioPlayChain.add(new TTSAlert(obj.Voice, obj.Message));
        audioPlayChain.add(new AlertChainComplete(obj, audioPlayWidget, executionQueue));
        if (Settings.QueuePlayback) {
            executionQueue.push(audioPlayChain);
        } else {
            audioPlayChain.execute();
        }
    });

    executionQueue.processNext();
</script>
